# Host nginx site for the landing page: /etc/nginx/sites-available/surespot.ng
# TLS is added by certbot once DNS points at this server:
#   sudo certbot --nginx -d surespot.ng -d www.surespot.ng --redirect

server {
    listen 80;
    listen [::]:80;
    server_name surespot.ng www.surespot.ng;

    # Only the two public endpoints the landing page needs are exposed from the
    # backend (same-origin, so no CORS config is required).
    location = /api/food-items/popular {
        limit_req zone=global_limit burst=20 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000/food-items/popular;
        proxy_http_version 1.1;
        proxy_set_header Host api.surespot.ng;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/newsletter/subscribe {
        limit_req zone=global_limit burst=5 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3000/newsletter/subscribe;
        proxy_http_version 1.1;
        proxy_set_header Host api.surespot.ng;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
